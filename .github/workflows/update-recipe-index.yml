name: Update recipe index

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  update-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Regenerate recipe index
        run: node .github/scripts/update-recipe-index.mjs
      - name: Commit changes if needed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update recipe index"